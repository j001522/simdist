# Manipulation (UR5e peg insertion) world model -- DINOv2 encoder variant.
# Frozen at trainable_blocks: 0; partially fine-tuned above that (see below).
# Diff vs manipulation_world_model.yaml: encoder.extero_obs.resnet -> .dinov2.
# Values tagged [Table II] come from simdist_paper.tex tab:model_man (app:manip).
# Values tagged [TBD] are placeholders pending encoder/dataset impl + data inspection.
# Mirrors config/model/quadruped_world_model.yaml; differences from it are noted.
type: manipulation_world_model

dataset:
  type: manipulation_world_model
  # H/T also select the processed dataset directory (processed_data_ur5e_H-<H>_T-<T>):
  # paths.get_processed_data_dir builds that name from THIS config, not from
  # config/process_data.yaml. Changing them requires the matching subdir to exist.
  history_length: 5       # 5 Hz data -> 1.0 s of history
  prediction_length: 5    # 5 Hz data -> 1.0 s horizon
  augmentations:
    add_noise: true       # proprio gaussian noise [app:manip]
    image:                # visual augs [app:manip] -- consumed by ManipulationWorldModelDataset (3.3)
      color_jitter: true
      gaussian_blur: true
      random_crop: true

dropout:
  mlp: 0.2                 # [TBD] not specified for manip; kept from quadruped
  attention: 0.05         # [TBD] idem

latent_dim: 64            # [Table II] embedding dimension

# Vision encoder: FROZEN DINOv2 ViT-S/14 per camera -> pooled cls_mean (2x384=768) ->
# stack 3x768, concat 6 joint obs -> MLP -> z(64).
#
# Differs from the paper's ResNet-18 (app:manip): this follows Newt (Hansen et al., 2025),
# which concatenates a pooled frozen-DINOv2 embedding with proprioception into an MLP
# state encoder. DINO-WM instead keeps the whole patch-token grid, but it has no
# reward/value head to carry the task signal; simdist does, so pooling is the consistent
# choice. See simdist/modeling/dinov2.py.
encoder:
  type: manipulation
  mlp_hidden_size_factor: 2
  proprio_obs_layers: 2
  extero_obs:
    dinov2:
      variant: dinov2-small   # 384-d hidden; ~= ResNet-18's 512 so latent_mlp barely moves
      pooling: cls_mean       # DINOv2's own linear-probe protocol -> 2*384 = 768 per camera
      # Staged by scripts/stage_dinov2_weights.py (login node -- compute nodes have no
      # network). Resolution-specific: the position embedding is baked at 224px.
      weights: dinov2-small-224.npz
      # Partial fine-tuning: adapt the last K of 12 transformer blocks (+ the final
      # layernorm); embeddings and the earlier blocks stay frozen. 0 = fully frozen,
      # which is byte-identical to the pre-fine-tuning branch and the only setting that
      # can resume from a frozen-run checkpoint (K>0 adds a state node).
      # K=4 -> 7.10M trainable backbone params of 21.6M. Freezing the prefix is also
      # what keeps this in memory: JAX stages no backward residuals for blocks whose
      # inputs and params are all outside the DiffState.
      trainable_blocks: 4
      # Backbone LR as a fraction of the head LR, applied via optax.multi_transform in
      # trainer.py. At 1.0 the ViT is destroyed in a few hundred steps; 1/10-1/100 is the
      # standard range. 2e-4 * 0.05 = 1e-5 peak.
      lr_mult: 0.05
    # cls_mean concatenates two blocks with different natural scales; normalize each
    # separately rather than with one shared statistic. See ManipulationEncoder.
    feature_norm: blockwise
  action_layers: 0            # schema parity with quadruped encoder; encoder is action-free
  # Proprio -> latent branch. null/"none" = the paper's raw concat (6 joint obs among
  # 3x768=2304 image dims, ~0.26%); "image" gives proprio its own block the size of one
  # camera embedding (384 under `cls`, 768 under `cls_mean`), i.e. it counts as an extra camera. An int sets the width
  # directly. See ManipulationEncoder for why this is a dimension problem, not a scale one.
  proprio_embed_dim: image
  # layernorm (affine-free, on the PROJECTED block) keeps the balance the projection buys
  # from being undone by the projection's own output scale; "none" keeps every dof of the
  # 6-d input at the price of an unguaranteed scale match. Only valid with a projection.
  proprio_norm: layernorm
  latent_layers: 2            # [TBD-schema] post-concat MLP -> z depth

embedding:
  mlp_hidden_size_factor: 2
  future_acts_layers: 0
  future_cmds_layers: 0       # cmd_dim=0 for manip (no goal command); see 3.2
  reward_layers: 0
  value_layers: 0

# All transformer MLP hidden size = 256 [Table II] = latent_dim(64) * factor(4).
dynamics:
  attention:
    layers: 3                 # [Table II] (quadruped: 2)
    heads: 4                  # [Table II] (quadruped: 8)
    mlp_hidden_size_factor: 4 # -> 256 hidden [Table II]
    mask: causal

reward:
  attention:
    layers: 1                 # [Table II]
    heads: 1                  # [Table II] (quadruped: 4)
    mlp_hidden_size_factor: 4 # -> 256 hidden [Table II]
    mask:                     # causal or leave empty
  decoder:
    layers: 0
    mlp_hidden_size_factor: 2

value:
  attention:
    layers: 1                 # [Table II]
    heads: 1                  # [Table II] (quadruped: 4)
    mlp_hidden_size_factor: 4 # -> 256 hidden [Table II]
    mask:                     # causal or leave empty
  decoder:
    layers: 0
    mlp_hidden_size_factor: 2

# Base policy: warm-starts MPPI. For manip its decoder query is LEARNED TEMPORAL
# EMBEDDINGS (not fut_cmds, since cmd_dim=0) 
policy:
  attention:
    layers: 4                 # [Table II] (same as quadruped)
    heads: 8                  # [Table II] (same as quadruped)
    mlp_hidden_size_factor: 4 # -> 256 hidden [Table II]
    mask: causal
  decoder:
    layers: 0
    mlp_hidden_size_factor: 2
