defaults:
  - system: ur5e

# Name of the RL run under checkpoints/rl/<rl_run> (symlink the Snellius run dir
# here; export_policies writes policies/ and critics/ inside it).
# 5 Hz expert (decimation 24); record env matches via Ur5eRecordEnvCfg.decimation=24.
rl_run: omnireset_2026-07-01_16-31-09
envs: 256       # parallel envs; rendering 3 cameras is heavy, keep modest
steps: 10000   # total env steps; trajectories accumulate as episodes reset (default 25000)
seed: 42

# Simplified single-nominal task (ur5e only): every DR event PINNED to a
# deterministic in-training-range value (never nulled -- nulled physics events
# left the critic obs OOD and poisoned the recorded values, see memory:
# value-target-inverted), dynamics at the sysid nominal, one grasped reset
# bank. Gate before collecting: expert 0.971/512 eps at 16 s, re-gated 0.965
# at the 10 s horizon (2026-07-17; episode shortened to cut the seated-plateau
# value-target spike), critic V +18->+21 monotone, clock-insensitive
# (experiments/value_target_analysis). Set enabled: false to record
# under the full DR distribution again.
# Banks come from experiments/ood_insertion/build_reset_banks.py.
# Collection #3 (2026-07-18): added GraspedVertLow (peg held 1.6-4.7cm above
# the board at 6-35cm lateral offsets). Rationale: single-bank VertHigh data
# confounds descent with approach -- probe_wm_lateral.py showed the WM dynamics
# under-prices lateral pushes ~50x and MPPI descends at the wrong lateral spot.
# VertLow supplies low-height lateral action-consequence coverage. The
# GraspedHoriz* banks stay held out (OOD test cells). Probs oversample the
# rarer low cell. VertLow gates (2026-07-18): expert 0.980/512 eps (failures =
# the known 3.8cm stall, no timeouts), critic monotone +18->+21 from 30cm
# lateral starts. Arm noise maxes doubled in system/ur5e.yaml same day.
simplify:
  enabled: true
  reset_dir: /shared/giacomo/experiments/ood_insertion/resets
  reset_types: [GraspedVertHigh, GraspedVertLow]
  probs: [0.6, 0.4]

expert: 1600  # 5Hz run's evaluated checkpoint (success 0.8877; eval_model_1600.json)
expert_prob: 0.5  # reset with a sub-optimal checkpoint with prob 0.5 (paper)

# Sub-optimal policy checkpoints (paper: saved every 100 up to checkpoint 1000).
non_experts:
  - 0
  - 100
  - 200
  - 300
  - 400
  - 500
  - 600
  - 700
  - 800
  - 900
  - 1000

action_corruption:
  never_noise_prob: 0.025  # Probability of envs never having noise
  intervals:
    # Paper: Gaussian noise injected for contiguous intervals U[1, 5] steps,
    # interleaved with noise-free intervals U[5, 10] steps.
    noise_min: 1
    noise_max: 5

    no_noise_min: 5
    no_noise_max: 10

    # repeat the above two steps until data collection is done. The sampled
    # intervals are different for each env.
