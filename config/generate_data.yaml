defaults:
  - system: ur5e

# Name of the RL run under checkpoints/rl/<rl_run> (symlink the Snellius run dir
# here; export_policies writes policies/ and critics/ inside it).
# 5 Hz expert (decimation 24); record env matches via Ur5eRecordEnvCfg.decimation=24.
rl_run: omnireset_2026-07-01_16-31-09
envs: 256       # parallel envs; rendering 3 cameras is heavy, keep modest
# `steps` is LOOP ITERATIONS, not env steps: each iteration is one env.step()
# across all `envs`, so recorded env steps = envs * steps.
# Sized for the paper's 100k trajectories (app:manip), read as 100k EPISODES:
# replaying the stop_on_success rule over the 07-18 rollouts (expert_prob 0.5,
# same noise) gives a mean truncated episode of 32.1 steps, so
#   100k eps * 32.1 / 256 envs = 12540 iterations = 3.21M env steps (~82 GB raw).
# At H=T=5 with 0/0 padding that is ~2.21M training windows (22.07 win/ep).
# Caveat: 32.1 was measured on the OLD GraspedVert* banks. If the expert seats
# less often on the full bank below, episodes lengthen toward the 50-step horizon
# and the same 12540 iterations yield proportionally FEWER (down to ~64k)
# episodes. Episode count is an outcome here, not a setting.
steps: 12540
seed: 42

# Simplified single-nominal task (ur5e only): every DR event PINNED to a
# deterministic in-training-range value (never nulled -- nulled physics events
# left the critic obs OOD and poisoned the recorded values, see memory:
# value-target-inverted), dynamics at the sysid nominal, one grasped reset
# bank. Gate before collecting: expert 0.971/512 eps at 16 s, re-gated 0.965
# at the 10 s horizon (2026-07-17; episode shortened to cut the seated-plateau
# value-target spike), critic V +18->+21 monotone, clock-insensitive
# (experiments/value_target_analysis). Set enabled: false to record
# under the full DR distribution again.
# Banks come from experiments/ood_insertion/build_reset_banks.py.
# Collection #3 (2026-07-18): added GraspedVertLow (peg held 1.6-4.7cm above
# the board at 6-35cm lateral offsets). Rationale: single-bank VertHigh data
# confounds descent with approach -- probe_wm_lateral.py showed the WM dynamics
# under-prices lateral pushes ~50x and MPPI descends at the wrong lateral spot.
# VertLow supplies low-height lateral action-consequence coverage. The
# GraspedHoriz* banks stay held out (OOD test cells). Probs oversample the
# rarer low cell. VertLow gates (2026-07-18): expert 0.980/512 eps (failures =
# the known 3.8cm stall, no timeouts), critic monotone +18->+21 from 30cm
# lateral starts. Arm noise maxes doubled in system/ur5e.yaml same day.
#
# Collection #4 (2026-07-24): GraspedVertHigh+VertLow -> GraspedAboveTable, the
# FULL grasped distribution (8379 states vs 1994). The 2x2 grid used only 21% of
# the held states and left two holes that the WM then had to extrapolate across:
# no peg tilt in 30-60 deg (where the median tilt of 40.5 deg and ~70% of the
# mass live) and no height in 0.05-0.12 m (the descent-to-contact band). Both are
# prime suspects for the lateral under-pricing above. Bank filter is recorded in
# resets/Resets/Peg__PegHole/resets_GraspedAboveTable.json.
# NOT YET GATED: unlike every previous bank change, the expert's success rate on
# this distribution is unmeasured -- the 30-60 deg tilt band is behaviour it has
# never been evaluated on. Gate first with
#   isaacpy experiments/ood_insertion/eval_scenarios.py \
#     --scenario GraspedAboveTable --iteration 1600 --num_envs 512
# Revert = reset_types [GraspedVertHigh, GraspedVertLow], probs [0.6, 0.4].
simplify:
  enabled: true
  reset_dir: /shared/giacomo/experiments/ood_insertion/resets
  reset_types: [GraspedAboveTable]
  probs: [1.0]

# Early-terminate an episode once the peg is seated (>=5 consecutive seated
# steps, gated to >= min_episode_length so every kept episode still spans the WM
# window H+T+pad). Stops recording the long redundant seated V~21 plateau and
# frees sim time for more distinct rollouts; also populates the per-demo
# `success` attr. Set enabled: false for the old time_out-only behavior.
stop_on_success:
  enabled: true
  min_episode_length: 20

expert: 1600  # 5Hz run's evaluated checkpoint (success 0.8877; eval_model_1600.json)
expert_prob: 0.5  # reset with a sub-optimal checkpoint with prob 0.5 (paper)

# Sub-optimal policy checkpoints (paper: saved every 100 up to checkpoint 1000).
non_experts:
  - 0
  - 100
  - 200
  - 300
  - 400
  - 500
  - 600
  - 700
  - 800
  - 900
  - 1000

action_corruption:
  never_noise_prob: 0.025  # Probability of envs never having noise
  intervals:
    # Paper: Gaussian noise injected for contiguous intervals U[1, 5] steps,
    # interleaved with noise-free intervals U[5, 10] steps.
    noise_min: 1
    noise_max: 5

    no_noise_min: 5
    no_noise_max: 10

    # repeat the above two steps until data collection is done. The sampled
    # intervals are different for each env.
